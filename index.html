<!DOCTYPE html>
<html lang="ru">
<head>
  <script>
    if(localStorage.getItem("okkm_theme") === "light") document.documentElement.setAttribute("data-theme", "light");
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OKK · Audio Quality Control</title>
  <style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
    :root {
      --bg: #0b0d12;
      --surface: #11151c;
      --surface-2: #1a2030;
      --border: #232a3a;
      --text: #e7ecf3;
      --text-invert: #111827;
      --text-white: #ffffff;
      --muted: #8a93a6;
      --primary: #3b82f6;
      --primary-2: #1d4ed8;
      --good: #10b981;
      --warn: #f59e0b;
      --bad: #ef4444;
      --neutral: #6b7280;
      --glass-01: var(--glass-01);
      --glass-015: var(--glass-015);
      --glass-02: var(--glass-02);
      --glass-03: var(--glass-03);
      --glass-04: var(--glass-04);
      --glass-05: var(--glass-05);
      --glass-06: var(--glass-06);
      --glass-07: var(--glass-07);
      --glass-08: var(--glass-08);
      --glass-10: var(--glass-10);
      --glass-12: var(--glass-12);
      --glass-15: var(--glass-15);
      --glass-20: var(--glass-20);
      --glass-30: var(--glass-30);
      --glass-40: var(--glass-40);
      --glass-70: var(--glass-70);
      --glass-80: var(--glass-80);
      --glass-85: var(--glass-85);
      --shadow-color: rgba(0,0,0,0.5);
      --card-bg: rgba(17, 22, 40, 0.65);
      --card-bg-chat: rgba(17, 22, 40, 0.4);
      --header-bg: rgba(13, 18, 30, 0.95);
      --modal-bg: rgba(17, 21, 28, 0.97);
      --chat-bg: rgba(30, 41, 59, 0.3);
      --chat-header-bg: rgba(15, 23, 42, 0.8);
      --input-bg: rgba(0,0,0,0.3);
      --code-bg: rgba(0,0,0,0.3);
      --color-scheme: var(--color-scheme);
      --chat-emp-bg: linear-gradient(135deg, #1E40AF, #2563EB);
      --chat-emp-color: #fff;
      --insight-bg: linear-gradient(135deg,rgba(30,41,59,0.4),rgba(15,23,42,0.6));
    }
    :root[data-theme="light"] {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-2: #e5e7eb;
      --border: #d1d5db;
      --text: #111827;
      --text-invert: #e7ecf3;
      --text-white: #ffffff;
      --muted: #4b5563;
      --primary: #2563eb;
      --primary-2: #1d4ed8;
      --good: #059669;
      --warn: #d97706;
      --bad: #dc2626;
      --neutral: #9ca3af;
      --glass-01: rgba(0,0,0,0.01);
      --glass-015: rgba(0,0,0,0.015);
      --glass-02: rgba(0,0,0,0.02);
      --glass-03: rgba(0,0,0,0.03);
      --glass-04: rgba(0,0,0,0.04);
      --glass-05: rgba(0,0,0,0.05);
      --glass-06: rgba(0,0,0,0.06);
      --glass-07: rgba(0,0,0,0.07);
      --glass-08: rgba(0,0,0,0.08);
      --glass-10: rgba(0,0,0,0.1);
      --glass-12: rgba(0,0,0,0.12);
      --glass-15: rgba(0,0,0,0.15);
      --glass-20: rgba(0,0,0,0.2);
      --glass-30: rgba(0,0,0,0.3);
      --glass-40: rgba(0,0,0,0.4);
      --glass-70: rgba(0,0,0,0.7);
      --glass-80: rgba(0,0,0,0.8);
      --glass-85: rgba(0,0,0,0.85);
      --shadow-color: rgba(0,0,0,0.1);
      --card-bg: #ffffff;
      --card-bg-chat: rgba(255, 255, 255, 0.7);
      --header-bg: rgba(255, 255, 255, 0.95);
      --modal-bg: rgba(255, 255, 255, 1);
      --chat-bg: rgba(243, 244, 246, 0.5);
      --chat-header-bg: rgba(255, 255, 255, 0.9);
      --input-bg: rgba(0,0,0,0.05);
      --code-bg: rgba(0,0,0,0.05);
      --color-scheme: light;
      --chat-emp-bg: linear-gradient(135deg, #3b82f6, #60a5fa);
      --chat-emp-color: #fff;
      --insight-bg: linear-gradient(135deg,rgba(219,234,254,0.6),rgba(191,219,254,0.4));
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button {
      background: var(--primary); color: white; border: none;
      padding: 8px 14px; border-radius: 8px; cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: var(--primary-2); }
    button.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: var(--border); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input, textarea, select {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 8px; font-size: 13px; font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }

    /* layout */
    .app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
    header.topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    header .brand { font-weight: 700; letter-spacing: 0.5px; }
    header .meta { color: var(--muted); font-size: 13px; display: flex; gap: 14px; align-items: center; }
    main { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
    nav.sidebar {
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 14px 8px; display: flex; flex-direction: column; gap: 4px;
    }
    nav.sidebar a {
      display: block; padding: 8px 12px; border-radius: 8px;
      color: var(--text); text-decoration: none; font-size: 13px;
    }
    nav.sidebar a:hover { background: var(--surface-2); }
    nav.sidebar a.active { background: var(--primary); color: white; }
    section.content { overflow: auto; padding: 22px 26px; }

    h1 { font-size: 22px; margin: 0 0 16px 0; }
    h2 { font-size: 16px; margin: 22px 0 10px 0; color: var(--text); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-bottom: 14px;
    }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .kpi { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
    .kpi .v { font-size: 22px; font-weight: 700; }
    .kpi .l { color: var(--muted); font-size: 12px; margin-top: 4px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { color: var(--muted); font-weight: 500; }
    tr:hover td { background: var(--surface-2); cursor: pointer; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .b-new        { background: rgba(107,114,128,.2); color: var(--neutral); }
    .b-downloading{ background: rgba(245,158,11,.15); color: var(--warn); }
    .b-downloaded { background: rgba(245,158,11,.25); color: var(--warn); }
    .b-transcribing{ background: rgba(59,130,246,.15); color: var(--primary); }
    .b-transcribed{ background: rgba(59,130,246,.25); color: var(--primary); }
    .b-analyzing  { background: rgba(59,130,246,.35); color: var(--primary); }
    .b-done       { background: rgba(16,185,129,.2); color: var(--good); }
    .b-failed     { background: rgba(239,68,68,.2); color: var(--bad); }

    .checklist .item { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .checklist .pass { color: var(--good); }
    .checklist .fail { color: var(--bad); }
    .checklist .item .ev { color: var(--muted); font-size: 12px; margin-top: 2px; }

    /* login */
    .login-wrap {
      display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg);
    }
    .login-card {
      width: 380px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px;
    }
    .login-card h1 { font-size: 20px; margin: 0 0 4px 0; }
    .login-card .muted { margin-bottom: 18px; }
    .login-card label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .login-card input { width: 100%; margin-bottom: 12px; }
    .login-card .error { color: var(--bad); margin-top: 6px; font-size: 12px; min-height: 16px; }

    .audio-player { width: 100%; margin: 8px 0; }
    .transcript {
      background: var(--surface-2); padding: 12px; border-radius: 8px;
      white-space: pre-wrap; max-height: 320px; overflow: auto; font-size: 13px; line-height: 1.55;
    }
    .toast {
      position: fixed; right: 22px; bottom: 22px;
      background: var(--surface-2); border: 1px solid var(--border); padding: 10px 14px;
      border-radius: 10px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.4);
    }
    
    /* Glassmorphism & Premium styles */
    .stat-card-v3 {
      background-color: var(--card-bg);
      background-image: radial-gradient(circle at 0% 100%, var(--bg-glow, transparent), transparent 70%);
      border: 1px solid var(--border-glow, var(--glass-08));
      border-radius: 24px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .stat-card-v3:hover {
      transform: translateY(-3px);
      border-color: var(--border-glow-hover, rgba(59, 130, 246, 0.4)) !important;
      background-image: radial-gradient(circle at 0% 100%, var(--bg-glow-hover, transparent), transparent 75%);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .stat-card-v3::after {
      content: ''; position: absolute; top: -50px; right: -50px; width: 120px; height: 120px;
      background: var(--glow, #3B82F6); filter: blur(60px); opacity: 0.12; pointer-events: none;
    }
    .kpi-lbl { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; font-weight: 700; }
    .kpi-val { font-size: 28px; font-weight: 800; color: var(--text-white); margin: 8px 0 4px 0; }
    .kpi-sub { font-size: 12px; color: var(--muted); }
    
    /* KPI Card Large Background Icon & Hover Effects */
    .kpi-bg-icon {
      position: absolute;
      right: 18px;
      bottom: 12px;
      font-size: 58px;
      opacity: 0.12;
      pointer-events: none;
      user-select: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
      filter: grayscale(0.2);
    }
    .stat-card-v3:hover .kpi-bg-icon {
      transform: scale(1.22) translateY(-4px);
      opacity: 0.45;
      filter: grayscale(0) drop-shadow(0 0 15px var(--glow, rgba(59,130,246,0.6)));
    }


    /* Premium Chat & Player styles */
    .chat-container {
      display: flex; flex-direction: column; gap: 14px; padding: 20px;
      background: var(--card-bg-chat); border-radius: 20px;
      border: 1px solid var(--glass-05); max-height: 480px; overflow-y: auto;
    }
    .chat-bubble {
      max-width: 78%; display: flex; flex-direction: column; gap: 4px;
      padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 13.5px;
      position: relative; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
    }
    .chat-bubble.employee {
      align-self: flex-end; background: var(--chat-emp-bg); color: var(--chat-emp-color);
      border-bottom-right-radius: 4px;
    }
    .chat-bubble.client {
      align-self: flex-start; background: var(--glass-04);
      color: var(--text); border: 1px solid var(--glass-07);
      border-bottom-left-radius: 4px;
    }
    .bubble-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; opacity: 0.65; font-weight: 500;
    }
    .bubble-time { font-family: monospace; }
    
    /* Stop words & quotes highlights */
    .stop-word-highlight {
      color: #F87171; background: rgba(239, 68, 68, 0.15); font-weight: 700;
      border-bottom: 2px wavy #EF4444; border-radius: 4px; padding: 0 3px;
      cursor: help; transition: all 0.2s ease;
    }
    .stop-word-highlight:hover {
      background: rgba(239, 68, 68, 0.25);
    }
    
    .evidence-highlight {
      animation: pulse-glow 2s ease-in-out 3;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); transform: scale(1); }
      50% { box-shadow: 0 0 25px 8px rgba(59, 130, 246, 0.7); transform: scale(1.02); }
    }
    
    /* Checklist items interactive */
    .chk-item-btn {
      cursor: pointer; transition: all 0.2s ease; border-radius: 12px;
      padding: 10px; margin-bottom: 8px; border: 1px solid transparent;
    }
    .chk-item-btn:hover {
      background: var(--glass-03);
      border-color: var(--glass-08);
      transform: translateX(4px);
    }
    
    /* Custom Audio Player */
    .premium-player {
      background: var(--glass-02); border: 1px solid var(--glass-07);
      border-radius: 16px; padding: 14px 20px; display: flex; align-items: center; gap: 16px;
      margin-top: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .player-play-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--primary);
      border: none; color: white; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }
    .player-play-btn:hover {
      transform: scale(1.08); background: #2563EB;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
    }
    .player-progress-container {
      flex-grow: 1; display: flex; flex-direction: column; gap: 6px;
    }
    .player-progress-bar-wrap {
      height: 6px; background: var(--glass-10); border-radius: 3px;
      position: relative; cursor: pointer; overflow: hidden;
    }
    .player-progress-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), #60A5FA);
      border-radius: 3px; transition: width 0.1s linear;
    }
    .player-time-lbl {
      display: flex; justify-content: space-between; font-size: 11px;
      color: var(--muted); font-family: monospace;
    }

    /* Dialog Card Row styles */
    .dialog-card-row {
      display: grid;
      grid-template-columns: 80px 1.5fr 1fr 1fr 1fr 1.8fr 70px 220px 100px;
      align-items: center;
      background: var(--glass-015);
      border: 1px solid var(--glass-05);
      border-radius: 16px;
      padding: 12px 18px;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }
    .dialog-card-row:hover {
      transform: translateY(-2px);
      background: var(--glass-03);
      border-color: rgba(59, 130, 246, 0.35);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }
    .avatar-circle {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      color: #60A5FA; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px;
    }
    .badge-trigger {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 8px;
      text-transform: uppercase; letter-spacing: 0.2px;
    }
    .badge-trigger.yes {
      background: rgba(16, 185, 129, 0.12); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .badge-trigger.no {
      background: rgba(239, 68, 68, 0.12); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .badge-trigger.partial {
      background: rgba(245, 158, 11, 0.12); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .badge-issue {
      background: rgba(239, 68, 68, 0.08); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.15);
      font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 6px;
      white-space: nowrap; margin-right: 4px; margin-bottom: 4px; display: inline-block;
    }
    .quality-score-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 32px; border-radius: 8px; font-weight: 800; font-size: 14px;
    }
    .quality-score-badge.good {
      border: 1.5px solid rgba(16, 185, 129, 0.35); color: #10B981; background: rgba(16, 185, 129, 0.05);
    }
    .quality-score-badge.average {
      border: 1.5px solid rgba(245, 158, 11, 0.35); color: #F59E0B; background: rgba(245, 158, 11, 0.05);
    }
    .quality-score-badge.bad {
      border: 1.5px solid rgba(239, 68, 68, 0.35); color: #EF4444; background: rgba(239, 68, 68, 0.05);
    }

    /* Embedded Mini Player */
    .mini-player {
      background: var(--glass-015); border: 1px solid var(--glass-05);
      border-radius: 10px; padding: 6px 12px; display: flex; align-items: center; gap: 10px;
      width: 210px;
    }
    .mini-play-btn {
      width: 26px; height: 26px; border-radius: 50%; background: var(--primary);
      border: none; color: white; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 11px; transition: all 0.15s ease;
    }
    .mini-play-btn:hover {
      transform: scale(1.08); background: #2563EB;
    }
    .mini-player-time {
      font-size: 10px; color: var(--muted); font-family: monospace; min-width: 65px;
    }
  
    /* MOBILE ADAPTATION */
    .hamburger { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 0 8px; }
    .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; }
    
        @media (max-width: 900px) {
      body { overflow-x: hidden; }
      .app { grid-template-rows: auto 1fr; max-width: 100vw; overflow-x: hidden; }
      .grid-4 { grid-template-columns: 1fr 1fr !important; }
      .grid-3 { grid-template-columns: 1fr !important; }
      .grid-2, #profile-cols { grid-template-columns: 1fr !important; }
      
      header.topbar {
        height: auto !important;
        flex-direction: column !important;
        align-items: stretch !important;
        padding: 10px 16px !important;
        gap: 12px !important;
      }
      header.topbar > div {
        width: 100% !important;
        flex-wrap: wrap !important;
      }
      header.topbar .brand {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
      }
      header.topbar .meta {
        display: flex !important;
        flex-direction: row !important;
        justify-content: flex-start !important;
        flex-wrap: wrap !important;
        gap: 8px !important;
      }
      header.topbar .meta > button, header.topbar .meta > div {
        width: auto !important;
        flex: 0 0 auto !important;
      }
      
      .hamburger { display: block; }
      
      main { grid-template-columns: 1fr !important; min-width: 0; }

      
      /* Force flex headers to wrap to prevent blowout */
      .content > div[style*="display:flex"], .content > div[style*="display: flex"] {
        flex-wrap: wrap !important;
        gap: 12px !important;
      }

      
      /* Fix Topbar Blowout */
      header.topbar .brand { flex-wrap: wrap !important; width: 100% !important; }
      header.topbar .brand > div:last-child:not(:nth-child(2)) { flex-wrap: wrap !important; width: 100% !important; margin-left: 0 !important; margin-top: 10px !important; }
      header.topbar select { min-width: 0 !important; max-width: 100% !important; flex: 1 !important; }
      .app { min-width: 0 !important; width: 100vw !important; max-width: 100vw !important; overflow-x: hidden !important; }

      
      
      /* Fix right edge cut-off */
      .stat-card-v3 > div[style*="display:flex"], .stat-card-v3 > div[style*="display: flex"] { flex-wrap: wrap !important; gap: 8px !important; }

      /* Fix right edge cut-off */
      .dialog-card-row, #list > div[style*="grid-template-columns"] { min-width: 1200px !important; padding-right: 16px !important; }

      /* Fix right edge cut-off */
      .content { padding: 16px !important; min-width: 0; width: 100% !important; overflow-x: hidden; }
      main > * { min-width: 0; }
      .stat-card-v3, .card, [style*="background:var(--card-bg)"] { max-width: 100%; min-width: 0; }

      
      nav.sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        bottom: 0;
        width: 240px;
        z-index: 10000;
        box-shadow: 4px 0 15px rgba(0,0,0,0.5);
        transition: left 0.3s ease;
        padding-top: 60px;
      }
      nav.sidebar.open { left: 0; }
      
      /* Overlay */
      .sidebar-overlay.open { display: block; }
      
      /* Horizontal Scroll for tables */
      .card, #list, #employeesList, #stationsList {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      table, .grid-table { min-width: 700px; }
      
      /* Detail player vertical split */
      #detail > div { flex-direction: column !important; }

      return;
    }
    
    const btn = document.getElementById(`mini-play-${id}`);
    const timeEl = document.getElementById(`mini-time-${id}`);
    const progEl = document.getElementById(`mini-progress-${id}`);
    
    if (window.currentMiniId === id) {
      if (window.currentMiniAudio) {
        if (!window.currentMiniAudio.paused) {
          window.currentMiniAudio.pause();
          if(btn) btn.innerText = "▶";
        } else {
          window.currentMiniAudio.play();
          if(btn) btn.innerText = "⏸";
        }
      } else {
        if (window.currentMiniAbort) {
          window.currentMiniAbort.abort();
          window.currentMiniAbort = null;
        }
        window.currentMiniId = null;
        if(btn) btn.innerText = "▶";
      }
      return;
    }
    
    if (window.currentMiniAbort) {
      window.currentMiniAbort.abort();
      window.currentMiniAbort = null;
    }
    
    if (window.currentMiniAudio) {
      window.currentMiniAudio.pause();
      window.currentMiniAudio.src = "";
      const oldBtn = document.getElementById(`mini-play-${window.currentMiniId}`);
      if(oldBtn) oldBtn.innerText = "▶";
      window.currentMiniAudio = null;

    window.currentMiniAbort = new AbortController();
    
    try {
        const resp = await fetch(url, { 
          headers: { "Authorization": "Bearer " + getToken() },
          signal: window.currentMiniAbort.signal
        });
        if (!resp.ok) throw new Error("Файл удален или в архиве");
        const blob = await resp.blob();
        
        if (window.currentMiniId !== id) return;
        
        const objUrl = URL.createObjectURL(blob);
        const audio = new Audio(objUrl);
        window.currentMiniAudio = audio;
        
        audio.addEventListener("timeupdate", () => {
           if(!progEl || !timeEl) return;
           const p = (audio.currentTime / (audio.duration || 1)) * 100;

        });

           window.currentMiniAudio = null;

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function setTokens(at, rt) { localStorage.setItem(TOKEN_KEY, at); localStorage.setItem(REFRESH_KEY, rt); }
  function clearTokens() { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(REFRESH_KEY); localStorage.removeItem("superadmin_token"); }

  async function api(method, path, body, raw=false) {
    const headers = { "Content-Type": "application/json" };
    const tok = getToken();
    if (tok) headers["Authorization"] = "Bearer " + tok;
    const opts = { method, headers };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);
    if (res.status === 401 && path !== "/api/auth/login") {
      if (path === "/api/auth/refresh") {
        clearTokens();
        location.hash = "";
        render();
        throw new Error("unauthorized");
      }
      const refresh = localStorage.getItem(REFRESH_KEY);
      if (refresh) {
        try {
          const r = await fetch("/api/auth/refresh", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refresh_token: refresh }),
          });
          if (r.ok) {
            const t = await r.json();
            setTokens(t.access_token, t.refresh_token);
            headers["Authorization"] = "Bearer " + t.access_token;
            const retry = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
            if (raw) return retry;
            if (!retry.ok) throw new Error(`${method} ${path} → ${retry.status}`);
            return retry.status === 204 ? null : retry.json();
          }
        } catch(err) {}
      }
      clearTokens();
      location.hash = "";
      render();
      throw new Error("unauthorized");
    }
    if (raw) return res;
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch {}
      throw new Error(`${method} ${path} → ${res.status} ${detail}`);
    }
    return res.status === 204 ? null : res.json();
  }

    if (exportBtn) {
      exportBtn.addEventListener("click", (e) => {
        if (!currentFilteredItems || currentFilteredItems.length === 0) {
          toast("Нет данных для выгрузки", "error");
          return;
        }
        
        const btn = e.currentTarget;
        const originalText = btn.innerHTML;
        btn.innerHTML = "⏳ Формирование...";
        btn.disabled = true;

        setTimeout(() => {
          try {
             let csv = "\uFEFF"; // BOM
             const chk = state.settings?.checklist_items || [];
             
             // Header row
             const headers = ["ID", "Дата", "Филиал", "Сотрудник", "Длительность (мин)", "Оценка ИИ", "Скрипт-комплаенс %", "Резюме ИИ"];
             chk.forEach(c => headers.push(c.label.replace(/\s*\(.*?\)/, '')));
             csv += headers.map(h => `"${String(h).replace(/"/g, '""')}"`).join(";") + "\n";
             
             currentFilteredItems.forEach(d => {
                const dt = d.start_time ? new Date(d.start_time).toLocaleString("ru-RU") : "—";

                const comp = d.script_compliance_pct !== null ? d.script_compliance_pct : "—";
                const aiText = (d.session_summary || d.summary || "").replace(/"/g, '""').replace(/\n/g, ' ');
                
                const row = [
                   d.id,
                   dt,
                   off,
                   emp,
                   dur,
                   score,
                   comp,
                   aiText
                ];
                
                const resMap = {};
                (d.checklist_results || []).forEach(r => {
                   resMap[r.checklist_item_id] = r;
                });
                
                chk.forEach(c => {
                   const res = resMap[c.id];
                   if (!res) { row.push(""); return; }
                   if (c.type === "boolean") {
                      row.push(res.is_passed ? "Да" : "Нет");
                   } else {
                      row.push((res.comment || res.evidence || "").trim());
                   }
                });
                
                csv += row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";") + "\n";
             });
             
             const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
             const url = URL.createObjectURL(blob);
             const a = document.createElement("a");
             a.style.display = "none";
             a.href = url;
             a.download = `dialogs_export_${new Date().toISOString().split('T')[0]}.csv`;
             document.body.appendChild(a);
             a.click();
            
            // Если у пользователя включено "Спрашивать куда сохранить",
            // нельзя удалять объект сразу, иначе Chrome зависнет.
            setTimeout(() => {
              if(document.body.contains(a)) document.body.removeChild(a);
              URL.revokeObjectURL(url);
            }, 60000); // 1 минута на сохранение
            
            toast("Формирование завершено! Сохраните файл.", "success");
          } catch(err) {
            console.error(err);
            toast("Ошибка экспорта: " + err.message, "error");
          } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }
        }, 50);
      });

  async function showDialog(container, id) {
    // the checklist block below reads state.settings; opening a dialog by direct link or
    // after F5 skips the list screen that normally loads it, and the card crashed on null
    if (!state.settings) {
      try {
        if (getToken() !== "demo_access") state.settings = await api("GET", "/api/settings/active");
        else state.settings = await mockApi.getSettings();
      } catch (e) { console.error(e); state.settings = { offices: [], checklist_items: [] }; }
    }
    let d;
    try {
      if (getToken() !== "demo_access" && id !== "d1" && id !== "d2") {
        d = await api("GET", `/api/dialogs/${id}`);
      } else {
        d = await mockApi.getDialog(id);
      }
    } catch (e) {
      console.error(e);
      d = { transcript: [], summary: "Failed to load", issues: [], checklist_results: [] };
    }
    const det = container.querySelector("#detail");
    const cl = (d.checklist_results || []);

    // 1. Transcript parser helper
    function parseTranscript(data) {
      if (!data) return [];
      if (Array.isArray(data)) {
        return data.map(item => {
          let t = "";
          if (item.start_sec !== undefined) {
            const m = Math.floor(item.start_sec / 60);
            const s = Math.round(item.start_sec % 60);
            t = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
          }
          return {
            time: t,
            speaker: item.speaker || "",
            text: item.text || ""
          };
        });
      }
      const lines = data.split('\n');
      const result = [];
      
      lines.forEach(line => {
        if (!line.trim()) return;
        const match = line.match(/^(?:\[?\*?\*?(\d{1,2}:\d{2})\*?\*?\]?)?\s*([^:]+):\s*(.*)$/);
        if (match) {
          result.push({
            time: match[1] || "",
            speaker: match[2].trim(),
            text: match[3].trim()
          });
        } else {
          result.push({
            time: "",
            speaker: "",
            text: line.trim()
          });
        }
      });
      return result;
    }

    // 2. Stop words highlighter helper
    function highlightStopWords(text) {
      if (!text) return "";
      const stopPhrases = [
        { regex: /\b(здрасьте|здрасти)\b/gi, label: "Стоп-слово: грубое приветствие" },
        { regex: /\b(что-нибудь еще|что-то еще|еще что-нибудь|еще что-то)\b/gi, label: "Стоп-слово: неэффективный кросс-сейл" },
        { regex: /\b(вам чек нужен|чек нужен|нужен чек|чек надо)\b/gi, label: "Стоп-слово: нарушение стандартов ФЗ" },
        { regex: /\bне\s+(хотите|желаете|попробуете|будете|надо|нужно)\b/gi, label: "Нарушение: предложение через отрицание 'НЕ'" }
      ];
      
      let highlighted = text;
      stopPhrases.forEach(item => {
        highlighted = highlighted.replace(item.regex, (match) => {
          return `<span class="stop-word-highlight" title="${escapeHtml(item.label)}">${escapeHtml(match)}</span>`;
        });
      });
      return highlighted;
    }

    function formatTime(secs) {
      if (isNaN(secs)) return "00:00";
      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = Math.floor(secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;

            bestMatchScore = 100;

            words.forEach(w => {
              if (bubbleText.includes(w)) matchCount++;
            });
            const score = words.length ? (matchCount / words.length) : 0;

              targetBubble = b;

        for(let d=1; d<=daysInMonth; d++) {

          const empName = emp.display_name || emp.ab400_user_id;

          if(shift) {
             const typeLabel = shift.start_time.includes("08:00") ? "☀️" : "🌙";
             
             let timelineHtml = "";

                 const shiftStart = new Date(shift.start_time).getTime();

                     let offsetSec = (st - shiftStart) / 1000;
                     if (offsetSec < 0) offsetSec = 0;
                     if (offsetSec > totalSec) return;
                     let dur = seg.duration_seconds;
                     if (offsetSec + dur > totalSec) dur = totalSec - offsetSec;
                     const leftPct = (offsetSec / totalSec) * 100;
                     const widthPct = (dur / totalSec) * 100;
                     timelineHtml += `<div style="position:absolute; top:0; left:${leftPct}%; width:${widthPct}%; height:100%; background:rgba(74, 222, 128, 0.9);"></div>`;

      if (getToken() === "demo_access") {

           window._mockShifts = window._mockShifts.filter(s => s.id !== shiftId);

        const empName = allEmps.find(e => e.id === empId)?.display_name || "";
        window._mockShifts.push({ ...payload, id: Date.now().toString(), employee_name: empName });
        modal.style.display = "none";

        await api("POST", "/api/shifts", payload);

    async function load() {
      const selStation = localStorage.getItem("okkm_global_station") || "all";
      const selPeriod = localStorage.getItem("okkm_global_period") || "24h";
      try {
        let endpoint = "/api/employees";
        if (getToken() !== "demo_access") {
          const params = new URLSearchParams();
          if (selStation !== "all") {
            const st = state.stations.find(x => String(x.identifier) === String(selStation));
            if (st) {
              const stName = st.name.split(" (")[0];
              params.set("office_last", stName);
            }
          }

          const nowTime = new Date();
          if (selPeriod === "24h") {
            const past24 = new Date(nowTime.getTime() - 24 * 60 * 60 * 1000);
            params.set("from", past24.toISOString().split(".")[0]);
          } else if (selPeriod === "yesterday") {
            const yesterdayStart = new Date(nowTime.getFullYear(), nowTime.getMonth(), nowTime.getDate() - 1, 0, 0, 0);
            const yesterdayEnd = new Date(nowTime.getFullYear(), nowTime.getMonth(), nowTime.getDate() - 1, 23, 59, 59);
            params.set("from", yesterdayStart.toISOString().split(".")[0]);
            params.set("to", yesterdayEnd.toISOString().split(".")[0]);
          } else if (selPeriod === "7d") {
            const past7d = new Date(nowTime.getTime() - 7 * 24 * 60 * 60 * 1000);
            params.set("from", past7d.toISOString().split(".")[0]);
          } else if (selPeriod === "custom") {
            const cf = localStorage.getItem("okkm_custom_from");
            const ct = localStorage.getItem("okkm_custom_to");
            if (cf) params.set("from", cf + "T00:00:00");
            if (ct) params.set("to", ct + "T23:59:59");
          } else if (selPeriod === "_impossible_") {
            const past7d = new Date(nowTime.getTime() - 7 * 24 * 60 * 60 * 1000);
            params.set("from", past7d.toISOString().split(".")[0]);
          }

          if (params.toString()) endpoint += "?" + params.toString();
        }
        localEmpList = getToken()!=="demo_access" ? await api("GET", endpoint) : await mockApi.getEmployees();
      } catch(e) { console.error(e); localEmpList = []; }

      // Apply Global Header Filters (Station & Period) to Employees
      if (selStation !== "all") {
        const st = state.stations.find(x => String(x.identifier) === String(selStation));
        if (st) {
          const stName = st.name.split(" (")[0];
          localEmpList = localEmpList.filter(e => (e.office_last || "").includes(stName));
        }
      }

      if (getToken() === "demo_access") {
        // Only apply mock multipliers if in demo access
        const pMult = selPeriod === "7d" ? 7 : (selPeriod === "yesterday" ? 1.1 : 1);
        const pShift = selPeriod === "7d" ? 4 : (selPeriod === "yesterday" ? -3 : 0);
        localEmpList = localEmpList.map(e => {
          const origUpsell = e.trigger_compliance_pcts || [80, 50, 40, 85, 75, 90];
          const newUpsell = origUpsell.map(v => Math.min(100, Math.max(0, v + pShift)));
          const newAvg = (newUpsell.reduce((s, v) => s + v, 0) / newUpsell.length / 10).toFixed(1);
          return {
            ...e,
            dialogs_total: Math.round((e.dialogs_done || e.dialogs_total || 20) * pMult),
            dialogs_done: Math.round((e.dialogs_done || 20) * pMult),
            avg_quality_score: parseFloat(newAvg),
            avg_script_compliance_pct: Math.round(newUpsell.reduce((s, v) => s + v, 0) / newUpsell.length),
            trigger_compliance_pcts: newUpsell
          };
        });
      }

      renderTable();

      // Check if returning from dialogs to employee profile or global filters re-rendered the profile page
      try {
        const retId = sessionStorage.getItem("returnToEmp");
        const retName = sessionStorage.getItem("returnToEmpName");
        const activeDetailId = sessionStorage.getItem("activeEmpDetailId");
        
        if (retId || retName || activeDetailId) {
          if (retId) sessionStorage.removeItem("returnToEmp");
          if (retName) sessionStorage.removeItem("returnToEmpName");
          const targetId = retId || activeDetailId;
          const targetEmp = localEmpList.find(e =>
            (targetId && (String(e.id) === String(targetId) || String(e.ab400_user_id) === String(targetId))) ||
            (retName && e.display_name === retName)
          );
          if (targetEmp) showDetail(targetEmp);
        }
      } catch(e) {}
    }

          ${triggers.slice(0, 3).map((t, idx) => {

  async function pageChat(container) {
    container.innerHTML = `
      <div style="display:flex; flex-direction:column; height:calc(100vh - 120px); background:var(--chat-bg); border-radius:24px; border:1px solid var(--glass-05); overflow:hidden;">
        <div style="padding:24px; border-bottom:1px solid var(--glass-05); background:var(--chat-header-bg);">
          <h1 style="margin:0; font-size:22px;">🤖 Чат с ИИ-Аналитиком</h1>
          <div style="font-size:13px; color:var(--muted); margin-top:6px;">Задайте любой вопрос по качеству обслуживания на естественном языке, и ИИ подготовит для вас понятный ответ на основе данных сети.</div>
        </div>
        <div id="chat-messages" style="flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:20px;">
          <div style="align-self:flex-start; max-width:80%; background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.2); padding:16px 20px; border-radius:20px; border-bottom-left-radius:4px; font-size:14px; line-height:1.5;">
            Привет! Я твой ИИ-Аналитик. Спроси меня о чем угодно.<br><br>
            <i style="color:var(--muted);">Примеры:</i><br>
            - Сколько у нас отсутствующих товаров?<br>
            - Покажи топ сотрудников по качеству обслуживания.<br>
            - Сколько диалогов было с негативным тоном?
          </div>
        </div>
        <div style="padding:20px; border-top:1px solid var(--glass-05); background:var(--chat-header-bg); display:flex; gap:12px;">
          <input type="text" id="chat-input" placeholder="Кто чаще предлагал кофе?..." style="flex:1; background:var(--glass-05); border:1px solid var(--glass-10); border-radius:12px; padding:14px 20px; color:var(--text); font-size:14px; outline:none;" autocomplete="off" />
          <button id="chat-send" class="primary" style="padding:0 24px; border-radius:12px; font-weight:600;">Отправить</button>
        </div>
      </div>
    `;

    const msgs = container.querySelector("#chat-messages");
    const input = container.querySelector("#chat-input");
    const btn = container.querySelector("#chat-send");

    function addMessage(text, isUser, extraHtml = "") {
      const div = document.createElement("div");
      div.style.maxWidth = "80%";
      div.style.padding = "16px 20px";
      div.style.borderRadius = "20px";
      div.style.fontSize = "14px";
      div.style.lineHeight = "1.5";
      if (isUser) {
        div.style.alignSelf = "flex-end";
        div.style.background = "var(--primary)";
        div.style.color = "#fff";
        div.style.borderBottomRightRadius = "4px";
        div.textContent = text;
      } else {
        div.style.alignSelf = "flex-start";
        div.style.background = "var(--glass-03)";
        div.style.border = "1px solid var(--glass-07)";
        div.style.borderBottomLeftRadius = "4px";
        div.innerHTML = (text ? `<div>${escapeHtml(text)}</div>` : "") + extraHtml;
      }
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      input.disabled = true;
      btn.disabled = true;
      addMessage(text, true);
      
      const loading = addMessage("Анализирую базу данных...", false);
      
      try {
        const res = await api("POST", "/api/analytics/chat", { message: text });
        loading.remove();
        
        let html = "";
        if (res.explanation) {
          html += `<div style="margin-bottom:16px;">${escapeHtml(res.explanation)}</div>`;
        }
        if (res.rows && res.rows.length > 0) {
          html += `<div style="overflow-x:auto; border-radius:12px; border:1px solid var(--glass-10); margin-top:12px;">
            <table style="width:100%; border-collapse:collapse; font-size:13px; text-align:left;">
              <thead>
                <tr style="background:var(--glass-05); border-bottom:1px solid var(--glass-10);">
                  ${res.columns.filter(c => c !== "audio_id" && c !== "audio_ids").map(c => `<th style="padding:12px 16px; color:var(--muted); font-weight:600;">${escapeHtml(c)}</th>`).join("")}
                </tr>
              </thead>
              <tbody>
                ${res.rows.map((row, i) => `
                  <tr style="border-bottom:1px solid var(--glass-03); background:${i % 2 === 0 ? 'transparent' : 'var(--glass-01)'};">
                    ${res.columns.filter(c => c !== "audio_id" && c !== "audio_ids").map(c => `<td style="padding:12px 16px;">${row[c] !== null ? escapeHtml(row[c]) : '<span class="muted">-</span>'}</td>`).join("")}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`;
        } else {
          html += `<div style="margin-top:12px; padding:12px; background:var(--glass-05); border-radius:8px; color:var(--muted);">Ничего не найдено.</div>`;
        }
        
        let allDialogIds = [];
        if (res.rows) {
          res.rows.forEach(r => {
             if (r.audio_id) allDialogIds.push(r.audio_id);
             if (r.audio_ids && Array.isArray(r.audio_ids)) allDialogIds.push(...r.audio_ids);
          });
        }
        allDialogIds = [...new Set(allDialogIds)];
        if (allDialogIds.length > 0) {
           const filterKey = "chat_filter_" + Date.now();
           try { sessionStorage.setItem(filterKey, JSON.stringify(allDialogIds)); } catch(e){}
           html += `<div style="margin-top:16px;">
             <button class="primary" onclick="location.hash='#/dialogs?filter_key=' + '${filterKey}'" style="padding:8px 16px; border-radius:10px; font-size:13px; font-weight:700; box-shadow: 0 4px 12px rgba(59,130,246,0.3);">
               🎙 Открыть диалоги по этому запросу (${allDialogIds.length}) →
             </button>
           </div>`;
        }

        
        
        addMessage("", false, html);
        
      } catch(e) {
        loading.remove();
        addMessage(`❌ Ошибка: ${escapeHtml(e.message)}`, false);
      }
      
      input.disabled = false;
      btn.disabled = false;
      input.focus();
    }

    btn.addEventListener("click", send);
    input.addEventListener("keydown", e => { if(e.key === "Enter") send(); });
  }

            </div>
            <button class="secondary" id="reset" style="padding:10px 16px; font-size:13px;">🔄 Сбросить</button>
          </div>
        </div>

        <!-- Right: 6 Triggers Checklist Cards -->
        <div class="stat-card-v3" style="display:flex; flex-direction:column; justify-content:space-between; padding:28px;">
          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
              <h3 id="checklist-title" style="margin:0; font-size:17px; color:var(--text);">Чек-лист контроля (6 триггеров)</h3>
              <span id="checklist-badge" class="badge" style="background:rgba(59,130,246,0.15); color:#3B82F6; padding:4px 8px; text-transform:uppercase;">6 Стандартов</span>
            </div>
            <p style="font-size:12px; color:var(--muted); margin-bottom:18px;">Критерии для автоматического подсчета % соблюдения скрипта кассиром.</p>
            
            <div id="checklist-container" style="display:flex; flex-direction:column; gap:12px; max-height:460px; overflow-y:auto; padding-right:4px;">
              <!-- Dynamically populated checklist items -->
            </div>
          </div>

          <div style="margin-top:20px;">
            <button id="addTriggerBtn" class="secondary" style="width:100%; border-style:dashed; border-color:rgba(59,130,246,0.4); color:#3B82F6; background:rgba(59,130,246,0.05); padding:10px;">+ Добавить стандарт контроля</button>
            <textarea id="checklist" style="display:none;"></textarea>
            <textarea id="scripts" style="display:none;"></textarea>
          </div>
        </div>
      </div>

      <!-- Reference Scripts Section -->
      <div class="stat-card-v3" style="padding:28px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
          <div>
            <h3 style="margin:0; font-size:18px; color:var(--text);">База знаний: Эталонные скрипты (AI Training)</h3>
            <div style="font-size:12px; color:var(--muted); margin-top:4px;">Сценарии и фреймворки идеального диалога кассира с клиентом</div>
          </div>
          <span class="badge" style="background:rgba(16,185,129,0.15); color:var(--good); padding:6px 12px; font-size:11px;">● ИИ ОБУЧЕН ПО СЦЕНАРИЯМ</span>
        </div>
        
        <div id="scripts-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:20px;">
          <!-- Dynamically populated scripts cards -->
        </div>
      </div>
    `;



    let currentChecklist = [];
    let currentScripts = [];

    // Edit Prompt Toggle
    const editPromptBtn = container.querySelector("#editPromptBtn");
    const nameInput = container.querySelector("#name");
    const promptInput = container.querySelector("#prompt");
    let isPromptEditing = false;

    editPromptBtn.addEventListener("click", () => {
      isPromptEditing = !isPromptEditing;
      if (isPromptEditing) {
        nameInput.removeAttribute("readonly");
        promptInput.removeAttribute("readonly");
        nameInput.style.borderBottom = "1px solid var(--primary)";
        promptInput.style.borderColor = "var(--primary)";
        editPromptBtn.textContent = "🔒 Заблокировать";
        promptInput.focus();
      } else {
        nameInput.setAttribute("readonly", true);
        promptInput.setAttribute("readonly", true);
        nameInput.style.borderBottom = "1px solid transparent";
        promptInput.style.borderColor = "transparent";
        editPromptBtn.textContent = "✏️ Изменить промпт";
      }
    });

    function renderChecklist(items) {
      currentChecklist = items;
      
      // Auto-migrate legacy pinned state and ensure defaults
      let pinnedCount = 0;
      items.forEach(item => {
        if (item.is_headline === undefined && item.pinned !== undefined) {
          item.is_headline = item.pinned;
        }
        delete item.pinned;
        if (item.is_headline) {
          pinnedCount++;
          if (pinnedCount > 2) item.is_headline = false; // Force max 2
        }
      });
      pinnedCount = items.filter(x => x.is_headline).length;
      if (pinnedCount === 0 && items.length >= 2) {
         items[0].is_headline = true;
         items[1].is_headline = true;
         pinnedCount = 2;
      }
      
      container.querySelector("#checklist-title").textContent = `Чек-лист контроля (${items.length} пунктов)`;
      const subEl = container.querySelector("#settings-subtitle");
      if (subEl) subEl.textContent = `Управление системными промптами, ${items.length} триггерами контроля и базами знаний скриптов`;
      const badgeEl = container.querySelector("#checklist-badge");
      if (badgeEl) badgeEl.textContent = `${items.length} Стандартов`;

      // Обновляем счётчик закреплённых
      let pinCounter = container.querySelector("#pin-counter");
      if (!pinCounter) {
        pinCounter = document.createElement("div");
        pinCounter.id = "pin-counter";
        pinCounter.style.cssText = "font-size:11.5px; color:var(--muted); margin-bottom:12px; padding:8px 12px; background:rgba(59,130,246,0.08); border:1px solid rgba(59,130,246,0.2); border-radius:10px;";
        container.querySelector("#checklist-container").insertAdjacentElement("beforebegin", pinCounter);
      }
      pinCounter.innerHTML = `📌 Закреплено в колонках списка диалогов: <b style="color:${pinnedCount===2?'#10B981':'#F59E0B'}">${pinnedCount}/2</b>${pinnedCount<2?' — <span style="color:#F59E0B;">выберите ещё ' + (2-pinnedCount) + '</span>':' — <span style="color:var(--good);">готово ✓</span>'}`;

      const listEl = container.querySelector("#checklist-container");
      listEl.innerHTML = items.map((item, idx) => {
        const isPinned = !!item.is_headline;
        const canPin = !isPinned && pinnedCount >= 2;
        return `
        <div style="background:var(--glass-03); border:1px solid ${isPinned ? 'rgba(59,130,246,0.4)' : 'var(--glass-08)'}; border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px; transition: border-color 0.2s;">
          <div style="background:rgba(59,130,246,0.15); color:#3B82F6; font-weight:800; font-size:12px; width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${idx+1}</div>
          <div style="flex:1;">
            <input class="chk-label" data-idx="${idx}" readonly value="${escapeHtml(item.label || item.id)}" style="width:100%; font-weight:700; color:var(--text); background:transparent; border:none; padding:4px 0; outline:none; border-bottom:1px solid transparent;" />
            <textarea class="chk-desc" data-idx="${idx}" readonly style="width:100%; font-size:11.5px; color:var(--muted); background:transparent; border:none; padding:4px 0; outline:none; border-bottom:1px solid transparent; resize:none; font-family:inherit;" rows="3" placeholder="Описание триггера...">${escapeHtml(item.description || '')}</textarea>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:6px;">
              <select class="chk-type" data-idx="${idx}" disabled style="background:var(--glass-05); color:var(--text); border:1px solid var(--glass-10); border-radius:6px; padding:4px 6px; font-size:11px; outline:none; width:100%;">
              <option value="boolean" ${(!item.type || item.type === 'boolean') ? 'selected' : ''}>Логический (% выполнения)</option>
              <option value="number" ${item.type === 'number' ? 'selected' : ''}>Числовой (Сумма и Среднее)</option>
              <option value="text" ${item.type === 'text' ? 'selected' : ''}>Текстовый (Списки и Причины)</option>
              </select>
              
            </div>
          </div>
          <div style="display:flex; gap:6px; align-items:center;">
            <button
              class="pin-chk-btn"
              data-idx="${idx}"
              title="${isPinned ? 'Открепить от колонок' : canPin ? 'Уже 2 закреплено — сначала открепите другой' : 'Закрепить в колонках списка диалогов'}"
              style="padding:5px 9px; border-radius:8px; border:1px solid ${isPinned ? 'rgba(59,130,246,0.6)' : 'var(--glass-10)'}; background:${isPinned ? 'rgba(59,130,246,0.15)' : 'transparent'}; color:${isPinned ? '#3B82F6' : canPin ? 'var(--glass-20)' : 'var(--glass-40)'}; font-size:14px; cursor:${canPin ? 'not-allowed' : 'pointer'}; transition: all 0.2s;"
              ${canPin ? 'disabled' : ''}
            >📌</button>
            <button class="secondary edit-chk-btn" data-idx="${idx}" style="padding:4px 8px; border:none; background:transparent; font-size:13px;">✏️</button>
            <button class="secondary del-chk" data-idx="${idx}" style="padding:4px 8px; color:var(--bad); border:none; background:transparent;">🗑️</button>
          </div>
        </div>`;
      }).join("");

      // ---- Handlers ----
      listEl.querySelectorAll(".chk-label").forEach(inp => {
        inp.addEventListener("input", (e) => { currentChecklist[e.target.dataset.idx].label = e.target.value; });
      });
      listEl.querySelectorAll(".chk-desc").forEach(inp => {
        inp.addEventListener("input", (e) => { currentChecklist[e.target.dataset.idx].description = e.target.value; });
      });
      listEl.querySelectorAll(".chk-type").forEach(sel => {
        sel.addEventListener("change", (e) => { currentChecklist[e.target.dataset.idx].type = e.target.value; });
      });
      listEl.querySelectorAll(".del-chk").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const idx = parseInt(e.target.closest("button").dataset.idx);
          currentChecklist.splice(idx, 1);
          if (currentScripts[idx]) currentScripts.splice(idx, 1);
          renderChecklist(currentChecklist);
          renderScripts(currentScripts);
        });
      });

      // Pin / unpin toggle
      listEl.querySelectorAll(".pin-chk-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const idx = parseInt(e.target.closest("button").dataset.idx);
          const item = currentChecklist[idx];
          if (item.is_headline) {
            item.is_headline = false;
          } else {
            const alreadyPinned = currentChecklist.filter(x => x.is_headline).length;
            if (alreadyPinned >= 2) return;
            item.is_headline = true;
          }
          renderChecklist(currentChecklist);
          if (getToken() === "demo_access") {
            state.settings = state.settings || {};
            state.settings.checklist_items = currentChecklist;
            try { localStorage.setItem("okkm_mock_settings", JSON.stringify(state.settings)); } catch(e) {}
          }
        });
      });

      // Pencil edit handler for checklist
      listEl.querySelectorAll(".edit-chk-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const targetBtn = e.target.closest("button");
          const idx = targetBtn.dataset.idx;
          const containerDiv = targetBtn.closest("div").parentElement;
          const labelInput = containerDiv.querySelector(".chk-label");
          const descInput = containerDiv.querySelector(".chk-desc");
          const typeSelect = containerDiv.querySelector(".chk-type");
                    const isEditing = labelInput.hasAttribute("readonly");
          if (isEditing) {
            labelInput.removeAttribute("readonly");
            descInput.removeAttribute("readonly");
            if (typeSelect) typeSelect.removeAttribute("disabled");
                        labelInput.style.borderBottom = "1px solid var(--primary)";
            descInput.style.borderBottom = "1px solid var(--primary)";
            targetBtn.textContent = "💾";
            labelInput.focus();
          } else {
            labelInput.setAttribute("readonly", true);
            descInput.setAttribute("readonly", true);
            if (typeSelect) typeSelect.setAttribute("disabled", "true");
                        labelInput.style.borderBottom = "1px solid transparent";
            descInput.style.borderBottom = "1px solid transparent";
            targetBtn.textContent = "✏️";
            if (currentScripts[idx]) {
              const scrItem = currentScripts[idx];
              const newVal = labelInput.value.trim();
              if (scrItem.t !== undefined) scrItem.t = newVal;
              if (scrItem.title !== undefined) scrItem.title = newVal;
              renderScripts(currentScripts);
            }
          }
        });
      });
    }

    function renderScripts(scripts) {
      currentScripts = scripts;
      const grid = container.querySelector("#scripts-grid");
      grid.innerHTML = scripts.map((sc, idx) => `
        <div style="background:var(--glass-02); border:1px solid var(--glass-07); border-radius:16px; padding:18px; display:flex; flex-direction:column; justify-content:space-between; position:relative;">
          <button class="secondary edit-scr-btn" data-idx="${idx}" style="position:absolute; top:12px; right:12px; border:none; background:transparent; font-size:13px; padding:4px;">✏️</button>
          <div>
            <input class="scr-title" data-idx="${idx}" readonly value="${escapeHtml(sc.t || sc.title || "")}" style="font-weight:700; color:#3B82F6; font-size:14px; margin-bottom:8px; width:80%; background:transparent; border:none; padding:4px 0; outline:none; border-bottom:1px solid transparent;" placeholder="Название стандарта..." />
            <textarea class="scr-content" data-idx="${idx}" readonly style="font-size:12.5px; color:var(--glass-85); line-height:1.6; font-style:italic; width:100%; height:90px; background:transparent; border:none; padding:4px 0; resize:none; outline:none; font-family:inherit; border-bottom:1px solid transparent;">${escapeHtml(sc.s || sc.content || "")}</textarea>
          </div>
          <div style="margin-top:14px; font-size:11px; color:var(--good); font-weight:700; display:flex; align-items:center; gap:5px;">
            <span>✓ Активный стандарт</span>
          </div>
        </div>
      `).join("");

      grid.querySelectorAll(".scr-title").forEach(inp => {
        inp.addEventListener("input", (e) => {
          const item = currentScripts[e.target.dataset.idx];
          if (item.t !== undefined) item.t = e.target.value;
          if (item.title !== undefined) item.title = e.target.value;
        });
      });
      grid.querySelectorAll(".scr-content").forEach(inp => {
        inp.addEventListener("input", (e) => {
          const item = currentScripts[e.target.dataset.idx];
          if (item.s !== undefined) item.s = e.target.value;
          if (item.content !== undefined) item.content = e.target.value;
        });
      });

      // Pencil edit handler for scripts
      grid.querySelectorAll(".edit-scr-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const targetBtn = e.target.closest("button");
          const containerDiv = targetBtn.parentElement;
          const titleInput = containerDiv.querySelector(".scr-title");
          const contentInput = containerDiv.querySelector(".scr-content");
          
          const isEditing = titleInput.hasAttribute("readonly");
          if (isEditing) {
            titleInput.removeAttribute("readonly");
            contentInput.removeAttribute("readonly");
            titleInput.style.borderBottom = "1px solid var(--primary)";
            contentInput.style.borderBottom = "1px solid var(--primary)";
            targetBtn.textContent = "💾";
            titleInput.focus();
          } else {
            titleInput.setAttribute("readonly", true);
            contentInput.setAttribute("readonly", true);
            titleInput.style.borderBottom = "1px solid transparent";
            contentInput.style.borderBottom = "1px solid transparent";
            targetBtn.textContent = "✏️";
          }
        });
      });
    }

    async function load() {
      try {
        if (getToken() !== "demo_access") {
          const p = await api("GET", "/api/settings/active");
          
          // Seed defaults for brand new companies
          if (!p.checklist_items || p.checklist_items.length === 0) {
              p.checklist_items = [
                  { id: "sales_detected", label: "Кол-во продаж (Чеков)", description: "Определи, состоялась ли сделка. Если клиент совершил оплату, впиши 1, иначе 0.", type: "number", is_headline: true },
                  { id: "greet", label: "Кол-во посещений (Приветствие)", description: "Приветствие и установление контакта в начале разговора.", type: "boolean", is_headline: true }
              ];
              p.system_prompt = "Ты — строгий ИИ-аудитор. Проанализируй разговор по стандартам.";
          }
          state.settings = p;
          
          container.querySelector("#name").value = p.name || "Стандарты обслуживания";
          container.querySelector("#prompt").value = p.system_prompt || "";
          const chk = p.checklist_items || [];
          let scr = p.reference_scripts || [];
          while (scr.length < chk.length) {
            scr.push({ t: chk[scr.length].label || "Скрипт", s: "⚠️ Это ПРИМЕР. Засчитывай любые фразы с аналогичным смыслом.\n\nОпишите идеальный скрипт..." });
          }
          if (scr.length > chk.length) scr = scr.slice(0, chk.length);
          renderChecklist(chk);
          renderScripts(scr);
        } else {
          let defs = await mockApi.getSettings();
          if (!state.settings) state.settings = defs;
          container.querySelector("#name").value = state.settings.name || "Стандарты обслуживания (ИИ-Аудит)";
          container.querySelector("#prompt").value = state.settings.system_prompt || defs.prompt;
          const chk = state.settings.checklist_items && state.settings.checklist_items.length ? state.settings.checklist_items : (defs.checklist_items || []);
          let scr = state.settings.reference_scripts && state.settings.reference_scripts.length ? state.settings.reference_scripts : (defs.scripts || []);
          while (scr.length < chk.length) {
             scr.push({ t: chk[scr.length].label || "Скрипт", s: "⚠️ Это ПРИМЕР. Засчитывай любые фразы с аналогичным смыслом.\n\nОпишите идеальный скрипт..." });
          }
          if (scr.length > chk.length) scr = scr.slice(0, chk.length);
          renderChecklist(chk);
          renderScripts(scr);
        }
      } catch (e) {
        console.error(e);
        container.querySelector("#name").value = "Error";
        container.querySelector("#prompt").value = "Failed to load settings.";
        renderChecklist([]);
        renderScripts([]);
      }
    }

    container.querySelector("#addTriggerBtn").addEventListener("click", () => {
      const newId = String(Date.now()); // уникальный id
      const newLabel = `Новый стандарт контроля`;
      currentChecklist.push({ id: newId, label: newLabel, description: "Описание стандарта...", pinned: false });
      currentScripts.push({ t: newLabel, s: "Пример эталонного скрипта для нового триггера..." });
      renderChecklist(currentChecklist);
      renderScripts(currentScripts);
    });

    container.querySelector("#reset").addEventListener("click", load);
    container.querySelector("#save").addEventListener("click", async () => {
      const name = container.querySelector("#name").value.trim();
      const prompt = container.querySelector("#prompt").value.trim();
      const newSettings = {
        name: name,
        system_prompt: prompt,
        checklist_items: currentChecklist,
        reference_scripts: currentScripts
      };

      try {
        if (getToken() !== "demo_access") {
          await api("PUT", "/api/settings/active", newSettings);
        }
      } catch (e) {}

      state.settings = { ...(state.settings || {}), ...newSettings };
      try { localStorage.setItem("okkm_mock_settings", JSON.stringify(state.settings)); } catch(e) {}
      
      toast("Настройки ИИ-аудитора сохранены!");
    });

    await load();
  }

  async function pageSync(container) {
    container.innerHTML = `<h1>Pipeline status</h1>
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <span class="muted">Total: <b id="total">—</b></span>
          <div class="row">
            <button id="refresh" class="secondary">Refresh</button>
            <button id="runSync">Run sync now</button>
          </div>
        </div>
      </div>
      <div class="grid-4" id="kpis"></div>
    `;
    async function refresh() {
      const s = await api("GET", "/api/sync/status");
      container.querySelector("#total").textContent = s.total;
      const k = container.querySelector("#kpis");
      k.innerHTML = Object.entries(s.counts).map(([name, v]) => `
        <div class="kpi"><div class="v">${v}</div><div class="l">${name}</div></div>
      `).join("");
    }
    container.querySelector("#refresh").addEventListener("click", refresh);
    container.querySelector("#runSync").addEventListener("click", async () => {
      try {
        const r = await api("POST", "/api/sync/run");
        toast(`ingest: ready=${r.ready} inserted=${r.inserted} rejected=${r.rejected_unparseable} deleted=${r.deleted || 0}`);
        refresh();
      } catch (e) { toast(e.message, "error"); }
    });
    await refresh();
  }

      try {
        if (getToken() !== "demo_access") {
            state.settings = await api("GET", "/api/settings/active");
            if (!state.settings.checklist_items || state.settings.checklist_items.length === 0) {
              state.settings.checklist_items = [
                  { id: "sales_detected", label: "Кол-во продаж (Чеков)", description: "Определи, состоялась ли сделка. Если клиент совершил оплату, впиши 1, иначе 0.", type: "number", is_headline: true },
                  { id: "greet", label: "Кол-во посещений (Приветствие)", description: "Приветствие и установление контакта в начале разговора.", type: "boolean", is_headline: true }
              ];
            }
        }
        else state.settings = await mockApi.getSettings();
      } catch(e) { console.error(e); state.settings = { offices: [], checklist_items: [] }; }
    }
    let selStation = localStorage.getItem("okkm_global_station") || "all";
    let selPeriod = localStorage.getItem("okkm_global_period") || "24h";
    
    // Create UI shell
    container.innerHTML = `

    async function loadBusinessData() {
      // 1. Fetch real dialogs
      let bDialogs = [];
      try {
        if (getToken() !== "demo_access") {
          const params = new URLSearchParams();
          params.set("limit", "500");

          if (selStation !== "all") {
            const st = state.stations.find(x => String(x.identifier) === String(selStation));
            if (st) params.set("office_last", st.name.split(" (")[0]);
          }

          const nowTime = new Date();
          if (selPeriod === "24h") {
            const past24 = new Date(nowTime.getTime() - 24 * 60 * 60 * 1000);
            params.set("from", past24.toISOString().split(".")[0]);
          } else if (selPeriod === "yesterday") {
            const yesterdayStart = new Date(nowTime.getFullYear(), nowTime.getMonth(), nowTime.getDate() - 1, 0, 0, 0);
            const yesterdayEnd = new Date(nowTime.getFullYear(), nowTime.getMonth(), nowTime.getDate() - 1, 23, 59, 59);
            params.set("from", yesterdayStart.toISOString().split(".")[0]);
            params.set("to", yesterdayEnd.toISOString().split(".")[0]);
          } else if (selPeriod === "7d") {
            const past7d = new Date(nowTime.getTime() - 7 * 24 * 60 * 60 * 1000);
            params.set("from", past7d.toISOString().split(".")[0]);
          } else if (selPeriod === "custom") {
            const cf = localStorage.getItem("okkm_custom_from");
            const ct = localStorage.getItem("okkm_custom_to");
            if (cf) params.set("from", cf + "T00:00:00");
            if (ct) params.set("to", ct + "T23:59:59");
          }

          bDialogs = await api("GET", "/api/dialogs?" + params.toString());
        } else {
          bDialogs = await mockApi.getDialogs(selStation, selPeriod);
          // DEMO MODE: Manually filter the mock dialogs so the UI reacts to global filters
          if (selStation !== "all") {
              const st = state.stations.find(x => String(x.identifier) === String(selStation));
              if (st) {
                  const stName = st.name.split(" (")[0].toLowerCase();
                  bDialogs = bDialogs.filter(d => d.office && (d.office.toLowerCase().includes(stName) || d.office.toLowerCase().includes(selStation.toLowerCase())));
              }
          }
          if (selPeriod === "yesterday") {
              // Mock a realistic drop in volume for "yesterday"
              bDialogs = bDialogs.filter((_, i) => i % 3 === 0);
          } else if (selPeriod === "7d") {
              // Mock a realistic increase in volume for "7d"
              const extra = [...bDialogs, ...bDialogs, ...bDialogs];
              bDialogs = bDialogs.concat(extra);
          }
        }
      } catch (e) { console.error("Business API error:", e); }

      // 2. Compute Traffic and Sales
      const visitors = bDialogs.length;
      let sales = 0;
      bDialogs.forEach(d => {
         const cl = d.checklist_results || [];
         // Ищем триггер, который отвечает за продажи (по id или названию)
         const sd = cl.find(r => r.id === "sales_detected") || cl.find(r => r.label && r.label.toLowerCase().includes("продаж") && !r.label.toLowerCase().includes("допродаж"));
         if (sd) {
             if (sd.comment === "1" || sd.comment === "Да" || (sd.passed && sd.comment !== "0" && sd.comment !== "Нет")) sales++;
         } else {
             // Fallback: if in demo mode and no sales trigger found, mock it
             if (getToken() === "demo_access") {

             }

      const conversion = visitors > 0 ? Math.round((sales / visitors) * 100) : 0;

      const chkItems = state.settings.checklist_items || [];

      let savedOrder = [];

          } else {

                    </tbody>

              </div>`;
          }

      const html = `

                          }
                       }
                    });
                    row.push(count);
                }
             });
             
             csv += headers.map(h => `"${h.replace(/"/g, '""')}"`).join(";") + "\n";
             csv += row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";") + "\n";

             const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
             const url = URL.createObjectURL(blob);
             const a = document.createElement("a");
             a.href = url;
             a.download = `business_metrics_${Date.now()}.csv`;
             a.click();
             URL.revokeObjectURL(url);
          });
      }
    }
    
    await loadBusinessData();
  }

  async function pageOverview(container) {
    if (!state.settings) {
      try {
        if (getToken() !== "demo_access") state.settings = await api("GET", "/api/settings/active");
        else state.settings = await mockApi.getSettings();
      } catch(e) { console.error(e); state.settings = { offices: [], checklist_items: [] }; }
    }
    
    const params = new URLSearchParams();
    const selStation = localStorage.getItem("okkm_global_station") || "all";
    if (selStation !== "all") {
      const st = state.stations.find(x => String(x.identifier) === String(selStation));
      if (st) params.set("office_last", st.name.split(" (")[0]);
    }

    const nowTime = new Date();
    const selPeriod = localStorage.getItem("okkm_global_period") || "24h";
    if (selPeriod === "24h") {
      const past24 = new Date(nowTime.getTime() - 24 * 60 * 60 * 1000);
      params.set("from", past24.toISOString().split(".")[0]);
    } else if (selPeriod === "yesterday") {
      const yesterdayStart = new Date(nowTime.getFullYear(), nowTime.getMonth(), nowTime.getDate() - 1, 0, 0, 0);
      const yesterdayEnd = new Date(nowTime.getFullYear(), nowTime.getMonth(), nowTime.getDate() - 1, 23, 59, 59);
      params.set("from", yesterdayStart.toISOString().split(".")[0]);
      params.set("to", yesterdayEnd.toISOString().split(".")[0]);
    } else if (selPeriod === "7d") {
      const past7d = new Date(nowTime.getTime() - 7 * 24 * 60 * 60 * 1000);
      params.set("from", past7d.toISOString().split(".")[0]);
    } else if (selPeriod === "custom") {
      const cf = localStorage.getItem("okkm_custom_from");
      const ct = localStorage.getItem("okkm_custom_to");
      if (cf) params.set("from", cf + "T00:00:00");
      if (ct) params.set("to", ct + "T23:59:59");
    }

    let summaryData;
    try {
      if (getToken() !== "demo_access") {
         summaryData = await api("GET", "/api/analytics/summary?" + params.toString());
         const checklistData = await api("GET", "/api/analytics/checklist-stats?" + params.toString());
         summaryData.trigger_stats = checklistData.items || [];

      else {

    // ── KPI card definitions ─────────────────────────────────────────────────
    // "fixed" cards are always anchored at positions 0-1; the rest come from checklist triggers.
    const FIXED_KPIS = [

          if (sp === "yesterday") return "За вчера";
          if (sp === "custom") return "За выбранный период";
          return "За последние 24 часа";

        getSub: () => "Цель по сети: >75%" }
    ];

    function getSemanticIcon(label) {
      if (!label) return "🎯";
      const l = label.toLowerCase();
      if (l.includes("привет")) return "🤝";
      if (l.includes("кофе")) return "☕️";
      if (l.includes("выпеч") || l.includes("хот-дог") || l.includes("сэндвич")) return "🥐";
      if (l.includes("повтор")) return "🔁";
      if (l.includes("чек")) return "🧾";
      if (l.includes("прощан") || l.includes("до свид") || l.includes("счастлив")) return "👋";

    const TRIGGER_KPIS = state.settings.checklist_items.map((t, i) => {

          ${(() => {
            let valColor = "var(--text)";

            if (strVal.includes("%")) {
               const num = parseFloat(strVal.replace("%", ""));
               if (!isNaN(num)) {
                 valColor = num >= 75 ? "#10B981" : (num >= 50 ? "#F59E0B" : "#EF4444");
               }
            } else if (!isNaN(parseFloat(strVal)) && strVal !== "—") {
               valColor = "#3B82F6"; // Blue for numbers
            }
            
            // Adjust font size for long text
            let fSize = strVal.length > 10 ? "16px" : (strVal.length > 5 ? "24px" : "32px");
            
            return `<div style="font-size:${fSize};font-weight:900;color:${valColor};line-height:1.1;margin:6px 0;position:relative;z-index:2;word-wrap:break-word;max-width:calc(100% - 20px);">${escapeHtml(strVal)}</div>`;
          })()}
          ${sub ? `<div style="font-size:11px;color:var(--muted);position:relative;z-index:2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 30px);" title="${escapeHtml(sub)}">${escapeHtml(sub)}</div>` : ``}

      row.innerHTML = cards + pinCard;

      row.querySelectorAll(".kpi-card-dyn").forEach(cardEl => {
        cardEl.addEventListener("dragstart", (e) => {
          const kpi = getKpiDef(cardEl.dataset.kpiid);
