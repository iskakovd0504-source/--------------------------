      </div>
      <div class="card" style="padding:0; overflow:hidden;">
        <table class="grid-table" style="width:100%;">
          <thead>
            <tr>
              <th style="padding:12px; text-align:left;">Email</th>
              <th style="padding:12px; text-align:left;">Имя</th>
              <th style="padding:12px; text-align:left;">Роль</th>
              <th style="padding:12px; text-align:right;">Действия</th>
            </tr>
          </thead>
          <tbody id="usersTbody">
            <tr><td colspan="4" style="text-align:center; padding:20px; color:var(--muted);">Загрузка...</td></tr>
          </tbody>
        </table>
      </div>
      
      <!-- Modal Add User -->
      <div id="addUserModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; justify-content:center; align-items:center;">
        <div class="card" style="width:400px; padding:24px;">
          <h3 style="margin-top:0; margin-bottom:16px;">Новый пользователь</h3>
          <div style="margin-bottom:12px;">
            <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:4px;">Имя</label>
            <input type="text" id="nuName" style="width:100%; padding:8px; border-radius:8px; border:1px solid var(--glass-12); background:var(--glass-05); color:var(--text);">
          </div>
          <div style="margin-bottom:12px;">
            <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:4px;">Email (Логин)</label>
            <input type="email" id="nuEmail" style="width:100%; padding:8px; border-radius:8px; border:1px solid var(--glass-12); background:var(--glass-05); color:var(--text);">
          </div>
          <div style="margin-bottom:12px;">
            <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:4px;">Пароль</label>
            <input type="text" id="nuPass" style="width:100%; padding:8px; border-radius:8px; border:1px solid var(--glass-12); background:var(--glass-05); color:var(--text);">
          </div>
          <div style="margin-bottom:24px;">
            <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:4px;">Роль</label>
            <select id="nuRole" style="width:100%; padding:8px; border-radius:8px; border:1px solid var(--glass-12); background:var(--glass-05); color:var(--text);">
              <option value="manager">РОП / Управляющий (Только чтение)</option>
              <option value="admin">Администратор (Полный доступ)</option>
            </select>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button class="secondary" id="nuCancel" style="padding:8px 16px;">Отмена</button>
            <button class="primary" id="nuSave" style="padding:8px 16px;">Создать</button>
          </div>
        </div>
      </div>
    `;
    
    const tbody = container.querySelector("#usersTbody");
    const modal = container.querySelector("#addUserModal");
    
    async function loadUsers() {
      if (getToken() === "demo_access") {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--muted);">В демо-режиме управление пользователями недоступно</td></tr>`;
        return;
      }
      try {
        const users = await api("GET", "/api/users");
        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--muted);">Нет пользователей</td></tr>`;
          return;
        }
        tbody.innerHTML = users.map(u => `
          <tr style="border-bottom:1px solid var(--glass-05); cursor:pointer; transition:background 0.2s;" onmouseover="this.style.background='var(--glass-05)'" onmouseout="this.style.background='transparent'">
            <td style="padding:12px;">${u.email}</td>
            <td style="padding:12px; font-weight:600;">${escapeHtml(u.name)}</td>
            <td style="padding:12px;"><span style="background:var(--glass-12); padding:4px 8px; border-radius:6px; font-size:11px;">${u.role === 'admin' ? 'Администратор' : 'Управляющий'}</span></td>
            <td style="padding:12px; text-align:right;">
              <button class="secondary del-user" data-id="${u.id}" style="padding:4px 8px; font-size:11px; border-color:var(--bad); color:var(--bad);">Удалить</button>
            </td>
          </tr>
        `).join('');
        
        tbody.querySelectorAll('.del-user').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            if(!confirm("Удалить пользователя?")) return;
            try {
              await api("DELETE", "/api/users/" + btn.dataset.id);
              toast("Пользователь удален", "info");
              loadUsers();
            } catch(err) {
              alert(err.message);
            }
          });
        });
      } catch(e) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--bad);">${escapeHtml(e.message)}</td></tr>`;
      }
    }
    
    container.querySelector("#addUserBtn").addEventListener("click", () => {
      if (getToken() === "demo_access") { alert("Недоступно в демо"); return; }
      modal.style.display = "flex";
    });
    
    container.querySelector("#nuCancel").addEventListener("click", () => modal.style.display="none");
    
    container.querySelector("#nuSave").addEventListener("click", async () => {
      const email = container.querySelector("#nuEmail").value.trim();
      const name = container.querySelector("#nuName").value.trim();
      const password = container.querySelector("#nuPass").value.trim();
      const role = container.querySelector("#nuRole").value;
      if (!email || !name || !password) return alert("Заполните все поля");
      
      try {
        await api("POST", "/api/users", { email, name, password, role });
        modal.style.display = "none";
        toast("Пользователь создан", "good");
        container.querySelector("#nuEmail").value = "";
        container.querySelector("#nuName").value = "";
        container.querySelector("#nuPass").value = "";
        loadUsers();
      } catch(e) {
        alert(e.message);
      }
    });
    
    loadUsers();
  }

  // ---------- router ----------
  
    if (!sessionStorage.getItem("okkm_app_started")) {
      localStorage.setItem("okkm_global_period", "24h");
      sessionStorage.setItem("okkm_app_started", "1");
    }

  
  window._scrollPositions = window._scrollPositions || {};
  window.addEventListener("scroll", (e) => {
    const path = location.hash || "#/overview";
    if (e.target === document || e.target === window || e.target === document.documentElement || e.target === document.body) {
      window._scrollPositions[path + "_win"] = window.scrollY || document.documentElement.scrollTop;
    } else if (e.target && e.target.classList && e.target.classList.contains("content")) {
      window._scrollPositions[path + "_content"] = e.target.scrollTop;
    } else if (e.target && e.target.id === "app") {
      window._scrollPositions[path + "_app"] = e.target.scrollTop;
    }
  }, true);

  let renderLoadingTimeout = null;
  async function render() {
   try {
    const root = document.getElementById("app");
    if (renderLoadingTimeout) clearTimeout(renderLoadingTimeout);
    renderLoadingTimeout = setTimeout(() => {
        root.innerHTML = '<div style="display:flex; justify-content:center; align-items:center; height:100vh; color:var(--muted); font-size:16px; font-weight:600; letter-spacing:0.5px;">Загрузка данных...</div>';
    }, 200);
    if (!getToken()) {
      clearTimeout(renderLoadingTimeout);
      root.innerHTML = "";
      root.appendChild(viewLogin());
      return;
    }
    const hash = location.hash || "#/overview";
    const hashWithoutQuery = hash.split("?")[0];
    const parts = hashWithoutQuery.replace("#/", "").split("/").filter(Boolean);
    const tab = parts[0];
    const dialogId = parts[1];
    
    if (!state.stations || state.stations.length === 0) {
      try {
        if (getToken() !== "demo_access") {
           state.stations = await api("GET", "/api/stations");
        } else {
           throw new Error("Demo Mode");
        }
      } catch(e) {
        let setts = await mockApi.getSettings();
        state.stations = setts.offices.map((o, idx) => ({ id: "mock-"+idx, name: o.label, identifier: idx.toString() }));
      }
    }
    
    const shell = await viewDashboard(tab, render);
    if (renderLoadingTimeout) clearTimeout(renderLoadingTimeout);
    root.innerHTML = "";
    root.appendChild(shell);
    const content = shell.querySelector("#content");
    if (!content) return;
    try {
      if (tab === "overview") await pageOverview(content);
      else if (tab === "business") await pageBusiness(content);
      else if (tab === "dialogs") {
        if (dialogId) await pageDialogDetail(content, dialogId);
        else await pageDialogs(content);
      }
      else if (tab === "employees") await pageEmployees(content);
      else if (tab === "shifts") await pageShifts(content);
      else if (tab === "stations") await pageStations(content);
      else if (tab === "settings") await pageSettings(content);
      else if (tab === "superadmin") await pageSuperadmin(content);
      else if (tab === "warehouse") await pageWarehouse(content);
      else if (tab === "users") await pageUsers(content);
      else if (tab === "chat") await pageChat(content);
      else if (tab === "sync") await pageSync(content);
      else { 
         if (state.user && state.user.role === "superadmin") {
            location.hash = "#/superadmin";
         } else {
            location.hash = "#/overview"; 
         }
      }
    } catch (e) {
      content.innerHTML = `<div class="card" style="border-color:var(--bad);">${escapeHtml(e.message)}</div>`;
    }
    setTimeout(restoreScroll, 50);
   } catch (outerErr) {
     if (outerErr.message === "unauthorized") return;
     console.warn("render error:", outerErr);
     clearTokens(); location.hash = ""; render();
   }
  }

  
  window.deleteDialog = async function(id) {
    if (!confirm("Вы уверены, что хотите удалить этот диалог? Это действие необратимо.")) return;
    try {
      const token = localStorage.getItem('superadmin_token') || localStorage.getItem('okk_access');
      const res = await fetch(`/api/dialogs/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.ok) {
        toast("Диалог успешно удален");
        window.dispatchEvent(new HashChangeEvent("hashchange"));
      } else {
        const errText = await res.text();
        toast("Не удалось удалить диалог: " + errText);
      }
    } catch (err) {
      toast("Ошибка удаления: " + err.message);
    }
  };

  // Scroll Restoration Helper
  const restoreScroll = () => {
    const path = location.hash || "#/overview";
    
    const winPos = window._scrollPositions[path + "_win"];
    if (winPos !== undefined) window.scrollTo(0, winPos);
    else window.scrollTo(0, 0);
    
    const c = document.querySelector(".content");
    if (c) {
      const cPos = window._scrollPositions[path + "_content"];
      if (cPos !== undefined) c.scrollTop = cPos;
      else c.scrollTop = 0;
    }
    
    const a = document.getElementById("app");
    if (a) {
      const aPos = window._scrollPositions[path + "_app"];
      if (aPos !== undefined) a.scrollTop = aPos;
    }
  };



  async function pageWarehouse(container) {
    container.innerHTML = `
      <div style="padding:28px;max-width:1400px;margin:0 auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;">
          <div>
            <h1 style="margin:0;font-size:26px;font-weight:900;">📦 Склад бейджей</h1>
            <div style="font-size:13px;color:var(--muted);margin-top:4px;">Нераспределенные устройства и их аудио</div>
          </div>
        </div>
        <div id="warehouse-content">Загрузка...</div>
      </div>
    `;

    try {
      const [badges, orgs] = await Promise.all([
        api("GET", "/api/superadmin/warehouse"),
        api("GET", "/api/superadmin/orgs")
      ]);

      const content = container.querySelector("#warehouse-content");

      if (badges.length === 0) {
        content.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);">Склад пуст. Все бейджи распределены по клиентам.</div>`;
        return;
      }

      let html = `
        <div style="background:var(--card-bg);border:1px solid var(--glass-10);border-radius:16px;overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;text-align:left;">
            <thead>
              <tr style="background:var(--glass-03);border-bottom:1px solid var(--glass-10);">
                <th style="padding:14px 16px;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;">ID Устройства</th>
                <th style="padding:14px 16px;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;">Последняя активность</th>
                <th style="padding:14px 16px;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;text-align:right;">Передать клиенту</th>
              </tr>
            </thead>
            <tbody>
      `;

      badges.forEach(b => {
        html += `
          <tr style="border-bottom:1px solid var(--glass-05);">
            <td style="padding:14px 16px;font-weight:700;">${escapeHtml(b.badge_id || b.name)}</td>
            <td style="padding:14px 16px;color:var(--muted);font-size:13px;">${b.last_seen_at ? new Date(b.last_seen_at).toLocaleString('ru') : 'Нет данных'}</td>
            <td style="padding:14px 16px;text-align:right;color:var(--muted);font-size:12px;">
              Переместите файлы в папку клиента
            </td>
          </tr>
        `;
      });

      html += `</tbody></table></div>`;
      content.innerHTML = html;
    } catch (e) {
      container.querySelector("#warehouse-content").innerHTML = `<div class="card" style="border-color:var(--bad);color:var(--bad);">${escapeHtml(e.message)}</div>`;
    }
  }

  window.addEventListener("hashchange", render);

  render();
  </script>
</body>
</html>
